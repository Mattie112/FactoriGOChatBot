name: Go test and build

on:
  push:
    branches:
      - main
    tags:
      - 'v*'
  pull_request:
    branches:
      - main

permissions:
  contents: read

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: ${{ github.event_name == 'pull_request' }}

env:
  # Keep in sync with the `go` directive in go.mod
  GO_VERSION: '1.26'
  DOCKER_IMAGE: mattie112/factorigo-chat-bot

jobs:
  test:
    name: Test
    runs-on: ubuntu-latest
    steps:
      - name: Check out repository code
        uses: actions/checkout@v7

      - name: Set up Go
        uses: actions/setup-go@v7
        with:
          go-version: ${{ env.GO_VERSION }}

      - name: Check that go.mod and go.sum are tidy
        run: go mod tidy -diff

      - name: Check formatting
        run: |
          unformatted="$(gofmt -l .)"
          if [ -n "$unformatted" ]; then
            echo "These files are not gofmt-formatted:"
            echo "$unformatted"
            exit 1
          fi

      - name: Vet
        run: go vet ./...

      - name: Test
        run: go test -v ./...

  build:
    name: Build
    runs-on: ubuntu-latest
    needs: test
    env:
      # Images are pushed for version tags (vX.Y.Z + latest) and for pull requests from this
      # repository (pr-N). Forks and Dependabot have no access to the Docker Hub secrets, so
      # for those (and for pushes to main) the image is only built, not pushed.
      PUSH_IMAGE: ${{ startsWith(github.ref, 'refs/tags/v') || (github.event_name == 'pull_request' && github.event.pull_request.head.repo.full_name == github.repository && github.actor != 'dependabot[bot]') }}
    steps:
      - name: Check out repository code
        uses: actions/checkout@v7

      - name: Set up Go
        uses: actions/setup-go@v7
        with:
          go-version: ${{ env.GO_VERSION }}

      - name: Determine version
        id: version
        run: |
          if [[ "$GITHUB_REF" == refs/tags/v* ]]; then
            version="$GITHUB_REF_NAME"
          else
            version="$(git rev-parse --short HEAD)"
          fi
          echo "version=$version" >> "$GITHUB_OUTPUT"
          echo "buildtime=$(date -u +%Y%m%d.%H%M%S)" >> "$GITHUB_OUTPUT"

      - name: Build Linux
        env:
          LDFLAGS: -s -w -X main.VERSION=${{ steps.version.outputs.version }} -X main.BUILDTIME=${{ steps.version.outputs.buildtime }}
        run: GOOS=linux GOARCH=amd64 CGO_ENABLED=0 go build -v -trimpath -ldflags "$LDFLAGS" -o bin/factorigo-chat-bot

      - name: Build Windows
        env:
          LDFLAGS: -s -w -X main.VERSION=${{ steps.version.outputs.version }} -X main.BUILDTIME=${{ steps.version.outputs.buildtime }}
        run: GOOS=windows GOARCH=amd64 CGO_ENABLED=0 go build -v -trimpath -ldflags "$LDFLAGS" -o bin/factorigo-chat-bot.exe

      - name: Upload Unix binary
        uses: actions/upload-artifact@v7
        with:
          name: factorigo-chat-bot-unix
          path: ./bin/factorigo-chat-bot
          if-no-files-found: error

      - name: Upload Windows binary
        uses: actions/upload-artifact@v7
        with:
          name: factorigo-chat-bot-windows
          path: ./bin/factorigo-chat-bot.exe
          if-no-files-found: error

      - name: Log in to Docker Hub
        if: env.PUSH_IMAGE == 'true'
        uses: docker/login-action@8aa5831fb8d48d8f76594c7ddde61ae58019f550 # v4.8.0
        with:
          username: ${{ secrets.DOCKER_USERNAME }}
          password: ${{ secrets.DOCKER_TOKEN }}

      - name: Extract metadata (tags, labels) for Docker
        id: meta
        uses: docker/metadata-action@dc802804100637a589fabce1cb79ff13a1411302 # v6.2.0
        with:
          images: ${{ env.DOCKER_IMAGE }}
          flavor: |
            latest=false
          tags: |
            type=ref,event=pr
            type=ref,event=branch
            type=ref,event=tag
            type=raw,value=latest,enable=${{ startsWith(github.ref, 'refs/tags/v') }}

      - name: Build and push Docker image
        uses: docker/build-push-action@c3c9e263c25d99ce0380d002d59b67737d91b0dc # v7.4.0
        with:
          context: .
          push: ${{ env.PUSH_IMAGE == 'true' }}
          tags: ${{ steps.meta.outputs.tags }}
          labels: ${{ steps.meta.outputs.labels }}

  release:
    name: Release
    if: startsWith(github.ref, 'refs/tags/v')
    runs-on: ubuntu-latest
    needs: build
    permissions:
      contents: write
    steps:
      - name: Download binaries
        uses: actions/download-artifact@v8
        with:
          path: artifacts

      - name: Prepare release assets
        run: |
          mkdir dist
          mv artifacts/factorigo-chat-bot-unix/factorigo-chat-bot dist/factorigo-chat-bot-unix
          mv artifacts/factorigo-chat-bot-windows/factorigo-chat-bot.exe dist/factorigo-chat-bot.exe
          cd dist
          sha256sum factorigo-chat-bot-unix factorigo-chat-bot.exe > checksums.txt
          cat checksums.txt

      - name: Publish GitHub release
        env:
          GH_TOKEN: ${{ github.token }}
          GH_REPO: ${{ github.repository }}
          TAG: ${{ github.ref_name }}
        run: |
          # Works both when only a tag was pushed and when the release was already created in the UI
          if gh release view "$TAG" > /dev/null 2>&1; then
            gh release upload "$TAG" dist/* --clobber
          else
            gh release create "$TAG" dist/* --title "$TAG" --generate-notes --verify-tag
          fi
